<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat walk</title>
<link rel="stylesheet" href="styles.css">
<style>
html, body { background: transparent !important; overflow: hidden; }
#walk { position: fixed; inset: 0; pointer-events: none; font: 700 15px/1.35 Nunito, 'Segoe UI', sans-serif; }
.wk-cat { position: absolute; bottom: 6px; left: 0; width: 150px; transform: translateX(-200px); }
.wk-cat .wk-body { animation: hop .52s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
.wk-cat.wk-walking { animation: across var(--dur, 11s) linear forwards; }
@keyframes across { from { transform: translateX(-200px); } to { transform: translateX(var(--to, 1600px)); } }
.wk-bubble { position: absolute; bottom: 150px; left: 40px; width: max-content; max-width: 320px; padding: 10px 14px; border-radius: 18px 18px 18px 6px;
  background: var(--s1); color: var(--tx); border: 2px solid var(--ac); box-shadow: 0 10px 26px -10px rgba(0,0,0,.6); opacity: 0;
  animation: pop .4s cubic-bezier(.34,1.56,.64,1) .5s forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.7) translateY(10px); } to { opacity: 1; transform: none; } }
.wk-paw { position: absolute; bottom: 8px; width: 22px; height: 22px; opacity: .8; color: var(--ac); animation: fade 3.2s ease-out forwards; }
.wk-paw svg { width: 100%; height: 100%; fill: currentColor; }
@keyframes fade { to { opacity: 0; transform: scale(.7); } }
#walk.wk-out { animation: away .6s ease forwards; }
@keyframes away { to { opacity: 0; } }
</style>
</head>
<body>
<div id="walk" class="ck dark mochi"></div>
<script type="module" src="walk.js"></script>
</body>
</html>
