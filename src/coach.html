<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat Key tip</title>
<style>
@font-face { font-family: 'Nunito'; src: url('assets/fonts/nunito.woff2') format('woff2'); font-weight: 200 1000; }
@font-face { font-family: 'Fredoka'; src: url('assets/fonts/fredoka.woff2') format('woff2'); font-weight: 300 700; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
body { font-family: Nunito, 'Segoe UI', sans-serif; color: #F7F0FB; display: flex; align-items: center; justify-content: center; }
.tip { position: relative; display: flex; flex-direction: column; gap: 9px; box-sizing: border-box; width: calc(100% - 8px); height: calc(100% - 8px); margin: 4px;
  padding: 12px 14px 12px 12px; border-radius: 22px; background: #211B2A; border: 1.5px solid #4a3c5c; box-shadow: 0 10px 28px rgba(0,0,0,.45);
  overflow: hidden; opacity: 0; --from: translateX(40px); transform: var(--from) scale(.96); }
/* Each spot on the screen slides in from its own side. */
body[data-anchor$="left"] .tip, body[data-anchor="left"] .tip { --from: translateX(-40px); }
body[data-anchor^="top"] .tip { --from: translateY(-34px); }
body[data-anchor="bottom-center"] .tip, body[data-anchor="bottom-left"] .tip.v, body[data-anchor="center"] .tip, body[data-anchor="custom"] .tip { --from: translateY(24px); }
/* The island: a black pill that grows out of the top of the screen. */
body[data-anchor="top-center"] .tip { background: #0B0910; border-color: #2a2333; border-radius: 30px; transform-origin: 50% 0; --from: translateY(-18px) scaleX(.55); }
.tip.in { animation: in .46s cubic-bezier(.34,1.5,.64,1) forwards; }
.tip.out { animation: out .32s ease forwards; }
@keyframes in { to { opacity: 1; transform: none; } }
@keyframes out { from { opacity: 1; transform: none; } to { opacity: 0; transform: var(--from) scale(.97); } }
.row { display: flex; align-items: center; gap: 12px; min-height: 0; }
.face { flex: none; width: 56px; height: 52px; }
.face .paw { transform-box: fill-box; transform-origin: 50% 100%; animation: wave 1s ease-in-out .35s 2; }
@keyframes wave { 50% { transform: rotate(-16deg) translateY(-2px); } }
.txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.use { font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 15px; color: #FFB8D2; }
.keys { display: inline-flex; gap: 5px; }
.kc { display: inline-block; min-width: 14px; height: 28px; line-height: 28px; padding: 0 9px; border-radius: 9px; text-align: center;
  background: #2C2437; box-shadow: inset 0 -3px 0 #120E18, 0 0 0 1px #4a3c5c; font-weight: 900; font-size: 14.5px; }
.what { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-weight: 700; font-size: 12px; color: #B7AAC8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts { display: flex; gap: 6px; }
.acts button { flex: 1; height: 30px; border: 0; border-radius: 10px; background: #2C2437; color: #E9DEF3; font: 800 12.5px Nunito, sans-serif; cursor: pointer;
  transition: background .15s, transform .12s; }
.acts button:hover { background: #3a2f48; }
.acts button:active { transform: scale(.96); }
.acts .adjust { background: #FF8CC6; color: #2a1020; }
.acts .adjust:hover { background: #ff9fd0; }
.acts .ignore { color: #C9BBD9; }
.bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: linear-gradient(90deg, #FF6FAE, #B79CFF); transform-origin: left; }
.tip.in .bar { animation: drain var(--life, 6s) linear .3s forwards; }
.tip.hold .bar { animation-play-state: paused; }
@keyframes drain { to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .tip.in, .tip.out, .face .paw, .tip.in .bar { animation-duration: 1ms; } }
</style>
</head>
<body>
<div class="tip" id="tip" role="status" aria-live="polite">
  <div class="row">
  <svg class="face" viewBox="0 0 64 60" aria-hidden="true">
    <path d="M10 26 12 6Q13 2 17 4L28 14Z" fill="#FFF7F0" stroke="#6B4A5E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M54 26 52 6Q51 2 47 4L36 14Z" fill="#FFF7F0" stroke="#6B4A5E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M15 22 16 10 24 16Z" fill="#FFB8D2"/><path d="M49 22 48 10 40 16Z" fill="#FFB8D2"/>
    <ellipse cx="32" cy="32" rx="25" ry="20" fill="#FFF7F0" stroke="#6B4A5E" stroke-width="2"/>
    <ellipse cx="23" cy="31" rx="4.2" ry="5.2" fill="#2E1E47"/><ellipse cx="41" cy="31" rx="4.2" ry="5.2" fill="#2E1E47"/>
    <circle cx="21.6" cy="29" r="1.6" fill="#fff"/><circle cx="39.6" cy="29" r="1.6" fill="#fff"/>
    <ellipse cx="15" cy="38" rx="4" ry="2.2" fill="#FF9EC4" opacity=".7"/><ellipse cx="49" cy="38" rx="4" ry="2.2" fill="#FF9EC4" opacity=".7"/>
    <path d="M30 36.5Q32 35 34 36.5Q33 38.5 32 39Q31 38.5 30 36.5Z" fill="#FF7FAF"/>
    <path d="M28 40Q30 42.5 32 40Q34 42.5 36 40" fill="none" stroke="#6B4A5E" stroke-width="1.6" stroke-linecap="round"/>
    <g class="paw"><ellipse cx="55" cy="50" rx="7" ry="6" fill="#FFF7F0" stroke="#6B4A5E" stroke-width="2"/><path d="M52 47v4M55 46v5M58 47v4" stroke="#6B4A5E" stroke-width="1.2" stroke-linecap="round" opacity=".55"/></g>
  </svg>
  <div class="txt">
    <div class="top"><span class="use" id="use">Try</span><span class="keys" id="keys"></span></div>
    <div class="what" id="what"></div>
    <div class="meta" id="meta"></div>
  </div>
  </div>
  <div class="acts">
    <button class="ignore" id="b-ignore" type="button" title="Never show this one again (you can give it back on the Coach page)">Ignore</button>
    <button class="dismiss" id="b-dismiss" type="button" title="Hide it for now">Dismiss</button>
    <button class="adjust" id="b-adjust" type="button" title="Make your own shortcut for this, in this app">Adjust</button>
  </div>
  <div class="bar"></div>
</div>
<script type="module" src="coach.js"></script>
</body>
</html>
