<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paw prints</title>
<style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; user-select: none; }
#paws { position: fixed; inset: 0; }
.pp { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; filter: drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 1px 2px rgba(0,0,0,.35)); will-change: transform, opacity; }
.pp svg { width: 100%; height: 100%; display: block; }
.pp.click { animation: click .9s cubic-bezier(.34,1.56,.64,1) forwards; }
.pp.right { animation: click .9s cubic-bezier(.34,1.56,.64,1) forwards; width: 21px; height: 21px; margin: -10px 0 0 -10px; }
.pp.trail { width: 17px; height: 17px; margin: -8px 0 0 -8px; animation: trail 1.1s ease-out forwards; }
.pp.scroll { width: 15px; height: 15px; margin: -7px 0 0 -7px; animation: scroll .8s ease-out forwards; }
@keyframes click { 0% { opacity: 0; transform: var(--r) scale(.3); } 25% { opacity: 1; transform: var(--r) scale(1.1); } 55% { opacity: 1; transform: var(--r) scale(1); } 100% { opacity: 0; transform: var(--r) scale(.85); } }
@keyframes trail { 0% { opacity: 0; transform: var(--r) scale(.6); } 20% { opacity: .95; transform: var(--r) scale(1); } 100% { opacity: 0; transform: var(--r) scale(.9); } }
@keyframes scroll { 0% { opacity: 0; transform: translateY(0) var(--r); } 30% { opacity: .95; } 100% { opacity: 0; transform: translateY(var(--dy)) var(--r); } }
@media (prefers-reduced-motion: reduce) { .pp { animation-duration: .5s !important; } }
</style>
</head>
<body>
<div id="paws"></div>
<script type="module" src="paws.js"></script>
</body>
</html>
