<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CatGPT</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="catgpt.css">
</head>
<body>
<div id="cg" class="ck dark mochi">
  <div class="cg-wheel" id="wheel" role="menu" aria-label="CatGPT">
    <div class="cg-ring" id="ring"></div>
    <div class="cg-hub" id="hub">
      <span class="cg-cat" id="cat"></span>
      <b id="hub-title">CatGPT</b>
      <span id="hub-sub">Hover to pick</span>
    </div>
    <div class="cg-card" id="card" hidden></div>
  </div>
</div>
<script type="module" src="catgpt.js"></script>
</body>
</html>
