name: Build Cat Key

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # A new version number on main publishes a release by itself. Branches named
    # test/… build and run every check on real Windows and Mac machines, without a release.
    branches: [main, "test/**"]
    paths: ["package.json", ".github/workflows/build.yml", ".github/release-notes.md"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine tests
        run: cargo test -p catkey-core

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Minify the app's pages for the release (the repo's source stays as it is)
        run: node scripts/protect.mjs
      - name: Build app and installer
        run: npx tauri build --config src-tauri/tauri.release.json
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # Stable names, so "releases/latest/download/…" links always get the newest version.
          Copy-Item target/release/CatKey.exe out/CatKey-portable-x64.exe
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/CatKey-Setup-x64.exe
          Get-ChildItem out
      - name: Dark mode with transparency effects off (the hardest case for see-through windows)
        shell: pwsh
        run: |
          $k = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $k -Force | Out-Null
          Set-ItemProperty -Path $k -Name EnableTransparency -Value 0 -Type DWord
          Set-ItemProperty -Path $k -Name AppsUseLightTheme -Value 0 -Type DWord
          Set-ItemProperty -Path $k -Name SystemUsesLightTheme -Value 0 -Type DWord
          Add-Type -Namespace CK -Name U -MemberDefinition '[DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr SendMessageTimeout(IntPtr h, uint m, UIntPtr w, string l, uint f, uint t, out UIntPtr r);'
          $r = [UIntPtr]::Zero
          [CK.U]::SendMessageTimeout([IntPtr]0xffff, 0x1A, [UIntPtr]::Zero, 'ImmersiveColorSet', 2, 5000, [ref]$r) | Out-Null
          "Dark mode on, transparency effects off"
      - name: Make sure it starts
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/CatKey.exe).Path
          Start-Process -Wait -FilePath $exe -ArgumentList '--list-apps', "$PWD\apps.json"
          $apps = Get-Content apps.json -Raw | ConvertFrom-Json
          "Your apps would list $($apps.Count) apps, like: $(($apps | Select-Object -First 12 | ForEach-Object { $_.name + ' (' + $_.exe + ')' }) -join ', ')"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content "$env:APPDATA\CatKey\catkey.log" -ErrorAction SilentlyContinue; throw "Cat Key stopped by itself (exit code $($p.ExitCode))" }
          "Still running after 15 s"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          # Again with the Cat Dock, a cat walk, a short focus timer, the paws and the app switcher.
          $d = Start-Process -FilePath $exe -ArgumentList '--dock-test' -PassThru
          Start-Sleep -Seconds 48
          if ($d.HasExited) { Get-Content "$env:APPDATA\CatKey\catkey.log" -ErrorAction SilentlyContinue; throw "Cat Key stopped with the Dock on (exit code $($d.ExitCode))" }
          "Dock check: still running after 48 s"
          Get-Content "$env:APPDATA\CatKey\catkey.log" -ErrorAction SilentlyContinue
          Get-Content "$env:APPDATA\CatKey\catkey.log" -ErrorAction SilentlyContinue | Where-Object { $_ -match 'dock:|switch:|coach|catgpt|permissions|shape:|crash' } | ForEach-Object { "::notice title=Windows log::$_" }
          Stop-Process -Id $d.Id -Force
          New-Item -ItemType Directory -Force -Path ci-pictures | Out-Null
          Copy-Item "$env:APPDATA\CatKey\ci\*.jpg" ci-pictures -ErrorAction SilentlyContinue
          # The MCP connection AI apps use: a handshake and the list of tools.
          Set-Content -Path mcp-in.txt -Value @('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}', '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          Start-Process -FilePath $exe -ArgumentList '--mcp' -RedirectStandardInput mcp-in.txt -RedirectStandardOutput mcp-out.txt -NoNewWindow -Wait
          $mcp = Get-Content mcp-out.txt -Raw
          if ($mcp -notmatch 'add_shortcut_pack') { "MCP answered: $mcp"; throw "The MCP connection didn't answer" }
          "::notice title=Windows MCP::$($mcp.Substring(0, [Math]::Min(200, $mcp.Length)) -replace "`r?`n", ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: CatKey-windows
          path: out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-pictures-windows
          path: ci-pictures/*
          if-no-files-found: ignore

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Minify the app's pages for the release (the repo's source stays as it is)
        run: node scripts/protect.mjs
      - name: Build the Mac app (Apple Silicon and Intel in one)
        run: npx tauri build --target universal-apple-darwin --bundles app --config src-tauri/tauri.release.json
      - name: Disk image and zip
        run: |
          set -e
          APP="target/universal-apple-darwin/release/bundle/macos/Cat Key.app"
          codesign --verify --verbose "$APP" || codesign --force --deep --sign - "$APP"
          mkdir -p out dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Cat Key" -srcfolder dmg -ov -format UDZO out/CatKey-mac.dmg
          ditto -c -k --keepParent "$APP" out/CatKey-mac.zip
          ls -la out
      - name: Make sure it starts
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/Cat Key.app"
          "$APP/Contents/MacOS/CatKey" --list-apps apps.json
          python3 -c "import json; a = json.load(open('apps.json')); print(f'Your apps would list {len(a)} apps, like:', ', '.join(f\"{x['name']} ({x['exe']})\" for x in a[:12]))"
          open "$APP"
          sleep 20
          if ! pgrep -x CatKey > /dev/null; then cat "$HOME/Library/Application Support/CatKey/catkey.log" || true; echo "Cat Key stopped by itself"; exit 1; fi
          echo "Still running after 20 s"
          pkill -x CatKey || true
          sleep 3
          # Again with the Cat Dock, a cat walk, a short focus timer, the paws and the app switcher.
          open "$APP" --args --dock-test
          sleep 48
          if ! pgrep -x CatKey > /dev/null; then cat "$HOME/Library/Application Support/CatKey/catkey.log" || true; echo "Cat Key stopped with the Dock on"; exit 1; fi
          echo "Dock check: still running after 48 s"
          cat "$HOME/Library/Application Support/CatKey/catkey.log" || true
          grep -E "dock:|switch:|coach|catgpt|permissions|shape:|crash" "$HOME/Library/Application Support/CatKey/catkey.log" | sed 's/^/::notice title=Mac log::/' || true
          pkill -x CatKey || true
          # The MCP connection AI apps use: a handshake and the list of tools.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | "$APP/Contents/MacOS/CatKey" --mcp > mcp-out.txt
          grep -q add_shortcut_pack mcp-out.txt || { cat mcp-out.txt; echo "The MCP connection didn't answer"; exit 1; }
          echo "::notice title=Mac MCP::$(head -c 200 mcp-out.txt | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: CatKey-mac
          path: out/*

  release:
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: CatKey-*
          merge-multiple: true
      - name: Version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Cat Key ${{ steps.ver.outputs.v }}
          body_path: .github/release-notes.md
          make_latest: true
          files: out/*
