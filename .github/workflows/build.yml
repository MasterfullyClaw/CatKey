name: Build Cat Key

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine tests
        run: cargo test -p catkey-core

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Build app and installer
        run: npm run build
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # Stable names, so "releases/latest/download/…" links always get the newest version.
          Copy-Item target/release/CatKey.exe out/CatKey-portable-x64.exe
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/CatKey-Setup-x64.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: CatKey-windows
          path: out/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Cat Key ${{ github.ref_name }}
          body_path: .github/release-notes.md
          make_latest: true
          files: out/*
